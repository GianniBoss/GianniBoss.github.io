releaseNotes: |-
  - Cada agente puede usar su propio modelo LLM desde su configuración; si se deja vacío usa el modelo global.
  - Nueva vista «Testing del sistema» en Ajustes: diagnóstico paso a paso del pipeline de compra/venta con el agente y el filtro exacto que bloquea.
  - Las noticias cripto se refrescan antes de cada análisis.
  - El supervisor de calidad de datos respeta la antigüedad máxima de cotización configurada.
  - Las actualizaciones muestran las notas de la versión y permiten descargar e instalar desde la app.
  - La agenda de agentes conserva un historial de tareas finalizadas.
